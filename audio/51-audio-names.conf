# Short names for the built-in audio devices: "ThinkPad Speakers", not "Core Ultra Processors (Series 3) HD Audio Speaker".
# The default name starts with the PCI database name of the chip. Apps such as Meet show it.
# The card rule replaces that prefix. WirePlumber still adds the HDMI monitor name in [].
# The node rules replace the whole name of a fixed output.
# NOTE: a node.description rule removes the automatic [monitor] part, thus HDMI has no node rule.
# Each rule matches the Gen 14 card name. On other hardware the rules have no effect.
monitor.alsa.rules = [
  {
    # NOTE: a card has no alsa.long_card_name when the rule runs. Nodes have both names.
    matches = [ { device.name = "~alsa_card.*", api.alsa.card.longname = "~.*ThinkPadX1CarbonGen14" } ]
    actions = { update-props = { device.description = "ThinkPad" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*__Speaker__sink", alsa.long_card_name = "~.*ThinkPadX1CarbonGen14" } ]
    actions = { update-props = { node.description = "ThinkPad Speakers" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*__Headphones__sink", alsa.long_card_name = "~.*ThinkPadX1CarbonGen14" } ]
    actions = { update-props = { node.description = "ThinkPad Headphone Jack" } }
  }
  {
    matches = [ { node.name = "~alsa_input.*__Mic__source", alsa.long_card_name = "~.*ThinkPadX1CarbonGen14" } ]
    actions = { update-props = { node.description = "ThinkPad Microphone Array" } }
  }
  {
    matches = [ { node.name = "~alsa_input.*__Headset__source", alsa.long_card_name = "~.*ThinkPadX1CarbonGen14" } ]
    actions = { update-props = { node.description = "Headset Microphone" } }
  }
]
