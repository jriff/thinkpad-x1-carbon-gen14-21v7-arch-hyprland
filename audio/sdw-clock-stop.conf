# Keep the SoundWire bus clock on when the audio DSP is idle.
#
# The CS42L45 mic codec (link 3) and the CS35L63 amps (link 2) fault when the
# link leaves clock-stop: "Bus clash", "Parity error" in the kernel log. The
# bus then resets and re-enumerates, and capture is silent for about 30 s.
# Bit 0 = SDW_INTEL_CLK_STOP_NOT_ALLOWED (include/linux/soundwire/sdw_intel.h).
# See README.md in this directory. Costs a few hundred mW on battery.
options snd_sof_intel_hda_generic sdw_clock_stop_quirks=1
