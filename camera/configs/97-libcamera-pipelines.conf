# Limit libcamera to the internal (simple pipeline) sensor for this service.
# Without it, libcamerasrc takes the first camera, and uvcvideo enumerates
# before simple, thus relayd can take a USB webcam. Credit: ocewers, basecamp/omarchy#6000.
# NOTE: This does not replace camera-name in ipu7.conf. Both internal sensors
# (RGB LNK0 and IR LNK1) are on the simple pipeline.
[Service]
Environment=LIBCAMERA_PIPELINES_MATCH_LIST=simple
