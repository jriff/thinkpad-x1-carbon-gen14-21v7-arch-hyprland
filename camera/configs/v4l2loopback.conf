# v4l2loopback options for the relayed internal camera (/dev/video50).
# install.sh installs this as /etc/modprobe.d/v4l2loopback-ipu7.conf.
# Without it the loopback loads as "Dummy video device" on a random node,
# v4l2-relayd@ipu7 cannot find CARD_LABEL, and Chromium ignores a loopback
# without exclusive_caps=1. Values match Intel's reference config.
options v4l2loopback video_nr=50 card_label="Hardware ISP Camera" exclusive_caps=1 max_buffers=16
