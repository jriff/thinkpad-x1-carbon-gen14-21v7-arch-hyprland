# camera-name pins the RGB sensor (LNK0). The IR camera (LNK1) enumerates
# first, and an unpinned libcamerasrc takes it. 97-libcamera-pipelines.conf
# keeps USB webcams out but does not replace this pin: LNK0 and LNK1 are both
# on the simple pipeline.
# Three backslashes: systemd's parser reduces them to two, then gst_parse to one.
# gamma, contrast and saturation are soft-ISP Adjust controls. Colour balance
# comes from the CCM in the tuning yaml. 1080p: libcamerasrc gives 1920x1080 as
# a crop of the sensor's 1928x1088 mode, thus no videoscale (ocewers, omarchy#6000).
VIDEOSRC="libcamerasrc camera-name=\\\_SB_.LNK0 gamma=2.0 contrast=1.50 saturation=1.20 ! videoconvert ! videorate drop-only=true skip-to-first=true"
SPLASHSRC="videotestsrc num-buffers=1 pattern=black ! imagefreeze num-buffers=4 ! videoscale ! videoconvert"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Hardware ISP Camera"
