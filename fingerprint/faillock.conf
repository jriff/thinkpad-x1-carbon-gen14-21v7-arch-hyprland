# Lockout policy. Stock deny=3 locks the account after two fingerprint unlocks.
# hyprlock runs a PAM password conversation and a direct fprintd verify at the
# same time (hyprwm/hyprlock#258). When the finger wins, the PAM conversation
# ends as a failure, pam_faillock counts it, and authsucc never runs. Thus each
# fingerprint unlock costs two attempts. `faillock --user $USER` shows them as SVC hyprlock.
# Values from Omarchy. Set here, not in system-auth: the pam_faillock lines there carry no inline deny=.
# NOTE: The pam package owns this file. An upgrade leaves a .pacnew; taking
# upstream restores deny=3. The maintenance sweep checks the effective value.
deny = 10
unlock_time = 120
