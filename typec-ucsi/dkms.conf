# DKMS registration for the patched typec_ucsi.
# The module must exist for each kernel version, in that version's updates/
# directory. DKMS rebuilds each registered module for each new kernel, driven
# by the pacman hook the dkms package ships. riffos-ucsi-retry-dkms (PKGBUILD)
# ships this tree; pacman's hooks drive DKMS.

PACKAGE_NAME="riffos-ucsi-retry"
PACKAGE_VERSION="1.0"

# The source is not vendored. ucsi.c must match the kernel being built for,
# thus PRE_BUILD fetches it for $kernelver. $kernelver is the kernel being
# installed, not the running one, thus the rebuild occurs during the upgrade.
PRE_BUILD="dkms-pre-build.sh $kernelver"

BUILT_MODULE_NAME[0]="typec_ucsi"

# updates/, not the driver's real path. depmod prefers updates/ over kernel/,
# thus this module shadows the in-tree one without replacing a packaged file.
# Removal of this module restores the stock driver.
DEST_MODULE_LOCATION[0]="/updates"

# Rebuild against each installed kernel.
AUTOINSTALL="yes"

# This module is for 7.1 and newer. The patch is written against 7.x ucsi.c,
# and thunderbolt.c does not exist in drivers/usb/typec/ucsi before 7.x.
# Both directives, because two readers: dkms(8) reads _MIN; Arch's pacman hook
# reads only the regex, and with the regex unset it matches each kernel.
# The regex matches major 7 and above, including two-digit majors.
BUILD_EXCLUSIVE_KERNEL="^([7-9]|[1-9][0-9]+)\."
BUILD_EXCLUSIVE_KERNEL_MIN="7.1"

# No REMAKE_INITRD. typec_ucsi is not in the initramfs.
